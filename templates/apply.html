{% extends "layout.html" %}

{% block content %}
<section class="form-section-container">
    <a href="{{ url_for('home') }}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <div class="form-panel-full">
        <div class="form-header">
            <h2>Application <span class="text-accent">Eligibility Assessment</span></h2>
            <p>Fill in applicant parameters below to run the predictive risk classification model.</p>
        </div>

        <form action="{{ url_for('predict') }}" method="POST" id="prediction-form" class="styled-form">
            <!-- Part 1: Applicant Details -->
            <fieldset class="form-fieldset">
                <legend><i class="fa-solid fa-user-gear"></i> Applicant Profile</legend>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="CODE_GENDER" required>
                            {% for opt in dropdowns.gender %}
                                <option value="{{ opt }}">{{ 'Male' if opt == 'M' else 'Female' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="age">Age (Years)</label>
                        <input type="text" id="age" name="AGE_YEARS" value="30" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                    <div class="form-group">
                        <label for="family_status">Marital Status</label>
                        <select id="family_status" name="NAME_FAMILY_STATUS" required>
                            {% for opt in dropdowns.family_status %}
                                <option value="{{ opt }}" {% if opt == 'Married' %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="education">Education</label>
                        <select id="education" name="NAME_EDUCATION_TYPE" required>
                            {% for opt in dropdowns.education_type %}
                                <option value="{{ opt }}" {% if opt == 'Secondary / secondary special' %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="children">Number of Children</label>
                        <input type="text" id="children" name="CNT_CHILDREN" value="0" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                    <div class="form-group">
                        <label for="housing_type">Housing Type</label>
                        <select id="housing_type" name="NAME_HOUSING_TYPE" required>
                            {% for opt in dropdowns.housing_type %}
                                <option value="{{ opt }}" {% if opt == 'House / apartment' %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Part 2: Employment & Income -->
            <fieldset class="form-fieldset">
                <legend><i class="fa-solid fa-briefcase"></i> Employment & Financials</legend>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="income_type">Income Category</label>
                        <select id="income_type" name="NAME_INCOME_TYPE" required>
                            {% for opt in dropdowns.income_type %}
                                <option value="{{ opt }}" {% if opt == 'Working' %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employment_years">Years Employed</label>
                        <input type="text" id="employment_years" name="EMPLOYMENT_YEARS" value="5" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label for="income">Annual Income (₹)</label>
                        <input type="text" id="income" name="AMT_INCOME_TOTAL" value="180000" inputmode="numeric" required>
                    </div>
                </div>

                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="occupation">Occupation</label>
                        <select id="occupation" name="OCCUPATION_TYPE" required>
                            {% for opt in dropdowns.occupation_type %}
                                <option value="{{ opt }}" {% if opt == 'Laborers' %}selected{% endif %}>{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fam_members">Family Size</label>
                        <input type="text" id="fam_members" name="CNT_FAM_MEMBERS" value="2" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                    <div class="form-group">
                        <label for="own_car_select">Owns Vehicle</label>
                        <select id="own_car_select" name="FLAG_OWN_CAR">
                            <option value="Y">Yes</option>
                            <option value="N" selected>No</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- Part 3: Financial History -->
            <fieldset class="form-fieldset">
                <legend><i class="fa-solid fa-layer-group"></i> Financial History Profile</legend>
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label for="num_months">Account History (Months)</label>
                        <input type="text" id="num_months" name="NUM_MONTHS" value="24" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                    <div class="form-group">
                        <label for="own_realty_select">Owns Property</label>
                        <select id="own_realty_select" name="FLAG_OWN_REALTY">
                            <option value="Y">Yes</option>
                            <option value="N" selected>No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contact Channels</label>
                        <div class="contact-toggles">
                            <label class="inline-check">
                                <input type="checkbox" id="work_phone" name="FLAG_WORK_PHONE" value="1">
                                <span>Work Phone</span>
                            </label>
                            <label class="inline-check">
                                <input type="checkbox" id="phone" name="FLAG_PHONE" value="1" checked>
                                <span>Mobile</span>
                            </label>
                            <label class="inline-check">
                                <input type="checkbox" id="email" name="FLAG_EMAIL" value="1">
                                <span>Email</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group-checkbox">
                        <label class="toggle-switch">
                            <input type="checkbox" id="is_retired" name="IS_RETIRED">
                            <span class="slider-toggle"></span>
                        </label>
                        <span class="checkbox-label">Retired / Pensioner Status</span>
                    </div>
                </div>
            </fieldset>

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary" id="reset-btn">
                    <i class="fa-solid fa-rotate-right"></i> Reset Form
                </button>
                <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Evaluate Qualification
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
