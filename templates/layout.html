<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditShield | Credit Card Approval Predictor</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="layout-container">
        <!-- Top Navigation Header -->
        <header class="main-header">
            <div class="header-container">
                <a href="{{ url_for('home') }}" class="logo-box">
                    <i class="fa-solid fa-shield-halved logo-icon"></i>
                    <span class="logo-text">Credit<span>Shield</span></span>
                </a>
                
                <nav class="main-nav">
                    <a href="{{ url_for('home') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                        Home
                    </a>
                    <a href="{{ url_for('apply') }}" class="nav-link {% if request.path == '/apply' %}active{% endif %}">
                        Prediction
                    </a>
                    <a href="{{ url_for('history') }}" class="nav-link {% if request.path == '/history' %}active{% endif %}">
                        History
                    </a>
                    <a href="{{ url_for('insights') }}" class="nav-link {% if request.path == '/insights' %}active{% endif %}">
                        Model Insights
                    </a>
                    <a href="{{ url_for('apply') }}" class="btn btn-cta-nav">
                        Check Eligibility <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </nav>
                
                <button class="mobile-nav-toggle"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- Mobile Sidebar Menu -->
        <aside class="mobile-sidebar">
            <div class="mobile-sidebar-header">
                <a href="{{ url_for('home') }}" class="logo-box">
                    <i class="fa-solid fa-shield-halved logo-icon"></i>
                    <span class="logo-text">Credit<span>Shield</span></span>
                </a>
                <button class="mobile-nav-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <nav class="mobile-nav-menu">
                <a href="{{ url_for('home') }}" class="mobile-nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="{{ url_for('apply') }}" class="mobile-nav-link {% if request.path == '/apply' %}active{% endif %}">
                    <i class="fa-solid fa-wallet"></i> Prediction
                </a>
                <a href="{{ url_for('history') }}" class="mobile-nav-link {% if request.path == '/history' %}active{% endif %}">
                    <i class="fa-solid fa-history"></i> History
                </a>
                <a href="{{ url_for('insights') }}" class="mobile-nav-link {% if request.path == '/insights' %}active{% endif %}">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> Model Insights
                </a>
            </nav>
        </aside>

        <!-- Main Body Wrapper -->
        <main class="page-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Main Footer -->
        <footer class="main-footer">
            <div class="footer-container">
                <p>&copy; 2026 CreditShield Risk Mitigation Engine. Automated Credit Approval predictions powered by IBM Watson Machine Learning & XGBoost Classifier.</p>
            </div>
        </footer>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
