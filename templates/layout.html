<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultGate AI | Automated Financial Risk Assessment</title>
    
    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="layout-container">
        <!-- Top Navigation Header -->
        <header class="main-header">
            <div class="header-container">
                <a href="{{ url_for('home') }}" class="logo-box">
                    <div class="logo-icon">
                        <i class="fa-solid fa-vault"></i>
                    </div>
                    <span class="logo-text">Vault<span>Gate</span></span>
                </a>
                
                <nav class="main-nav">
                    <a href="{{ url_for('home') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                        Home
                    </a>
                    <a href="{{ url_for('apply') }}" class="nav-link {% if request.path == '/apply' %}active{% endif %}">
                        Assessment
                    </a>
                    <a href="{{ url_for('history') }}" class="nav-link {% if request.path == '/history' %}active{% endif %}">
                        History Log
                    </a>
                    <a href="{{ url_for('apply') }}" class="btn-cta-nav">
                        Check Eligibility <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </nav>
                
                <button class="mobile-nav-toggle" aria-label="Toggle Menu"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- Mobile Sidebar Menu -->
        <aside class="mobile-sidebar">
            <div class="mobile-sidebar-header">
                <a href="{{ url_for('home') }}" class="logo-box">
                    <div class="logo-icon">
                        <i class="fa-solid fa-vault"></i>
                    </div>
                    <span class="logo-text">Vault<span>Gate</span></span>
                </a>
                <button class="mobile-nav-close" aria-label="Close Menu"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <nav class="mobile-nav-menu">
                <a href="{{ url_for('home') }}" class="mobile-nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="{{ url_for('apply') }}" class="mobile-nav-link {% if request.path == '/apply' %}active{% endif %}">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Assessment
                </a>
                <a href="{{ url_for('history') }}" class="mobile-nav-link {% if request.path == '/history' %}active{% endif %}">
                    <i class="fa-solid fa-clock-rotate-left"></i> History Log
                </a>
            </nav>
        </aside>

        <!-- Main Body Wrapper -->
        <main class="page-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Main Footer -->
        <footer class="main-footer">
            <div class="footer-container">
                <p>&copy; 2026 VaultGate Risk Scoring Engine. Automated Machine Learning Decision Analytics.</p>
            </div>
        </footer>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
